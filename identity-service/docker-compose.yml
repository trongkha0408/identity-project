version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: identity-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: identity_service
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: identity-app
    ports:
      - "8080:8080"
    environment:
      DBMS_CONNECTION: jdbc:mysql://mysql:3306/identity_service
      DBMS_USERNAME: root
      DBMS_PASSWORD: 123456
      MAIL_USERNAME: trkha0408@gmail.com
      MAIL_PASSWORD: fakeggxznhiinfgj
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: